<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Inteligencia artificial</title>
<link rel="stylesheet" href="base.css">
<style>
  .chat { left: 880px; top: 290px; width: 650px; height: 480px; padding: 26px; }
  .msg { position: absolute; max-width: 430px; padding: 16px 20px; border-radius: 18px; font-size: 22px; line-height: 1.35; }
  .yo { right: 26px; background: #1d3b6e; border-bottom-right-radius: 6px; }
  .bot { left: 26px; background: #0f2242; border: 1.5px solid rgb(76 157 255 / .5); border-bottom-left-radius: 6px; }
  .bot b { color: var(--ambar); }
  .puntos { display: flex; gap: 8px; } .puntos i { width: 12px; height: 12px; border-radius: 50%; background: var(--claro); animation: late .8s infinite; }
  .puntos i:nth-child(2) { animation-delay: -.53s; } .puntos i:nth-child(3) { animation-delay: -.26s; }
  .auto { position: absolute; left: 26px; bottom: 24px; display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-radius: 999px;
    border: 1.5px solid rgb(74 222 128 / .7); color: #c9f7da; font: 400 18px/1 "JetBrains Mono"; box-shadow: 0 0 16px rgb(74 222 128 / .25); }
  .nodo-red { fill: #0b1830; stroke: var(--azul); stroke-width: 2.5; }
  .nodo-luz { fill: var(--cian); filter: drop-shadow(0 0 8px var(--cian)); }
  .arista-luz { stroke: var(--cian); stroke-width: 2.5; filter: drop-shadow(0 0 5px var(--cian)); }
</style></head>
<body>
  <div class="cab"><div class="num">SERVICIO 04</div><h1 data-t-en="Artificial<br>intelligence">Inteligencia<br>artificial</h1></div>
  <svg id="red" width="1600" height="900" style="position:absolute;inset:0"></svg>
  <div class="etq" style="position:absolute;left:96px;top:772px;color:var(--tenue)">Red neuronal</div>

  <div class="caja chat">
    <div class="msg yo" style="top:26px" data-en="0.8">¿Cuántas ventas esperamos en diciembre?</div>
    <div class="msg bot" style="top:120px" data-en="1.5" data-sale="2.5"><div class="puntos"><i></i><i></i><i></i></div></div>
    <div class="msg bot" style="top:120px" data-en="2.5">Según el modelo, <b>un 18 % más</b> que en noviembre.</div>
    <svg style="position:absolute;left:26px;top:226px" width="598" height="150" data-en="3.0">
      <path class="tenue" d="M0 140 H598" />
      <g fill="#2a4a80"><rect x="10" y="80" width="44" height="60" rx="5" /><rect x="74" y="66" width="44" height="74" rx="5" /><rect x="138" y="88" width="44" height="52" rx="5" /><rect x="202" y="58" width="44" height="82" rx="5" /><rect x="266" y="46" width="44" height="94" rx="5" /><rect x="330" y="54" width="44" height="86" rx="5" /></g>
      <path class="neon" d="M32 76 L96 62 L160 84 L224 54 L288 42 L352 50" data-traza="3.2" data-dura=".8" />
      <path d="M352 50 L416 36 L480 30 L544 12" fill="none" stroke="#f2b45a" stroke-width="3.5" stroke-dasharray="10 9" style="filter:drop-shadow(0 0 6px #f2b45a)" data-en="4.0" />
      <circle cx="544" cy="12" r="8" fill="#f2b45a" data-en="4.4" data-desde="scale(.2)" style="transform-origin:544px 12px" />
      <text x="420" y="78" font-size="16" fill="#f2b45a" data-en="4.4">pronóstico</text>
    </svg>
    <div class="auto" data-en="5.2"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.6" stroke-linecap="round"><path d="M20 6 9 17l-5-5" /></svg>Reporte enviado al equipo automáticamente</div>
  </div>

  <div class="chips" style="left:auto;right:70px;bottom:44px"><span>Automatización</span><span>Asistentes</span><span>Modelos predictivos</span><span>Redes neuronales</span></div>
  <script>
    // Red de 4 capas: aristas tenues fijas y, encima, ondas de activación que avanzan capa por capa (dos por ciclo)
    const capas = [4, 6, 6, 3], X = [130, 330, 530, 730], Y0 = 330, ALTO = 420;
    const pos = capas.map((n, c) => Array.from({ length: n }, (_, k) => [X[c], Y0 + (ALTO / (n + 1)) * (k + 1)]));
    const svg = document.getElementById("red");
    const ns = "http://www.w3.org/2000/svg";
    const el = (tag, attrs, padre = svg) => { const e = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); padre.appendChild(e); return e; };
    for (let c = 0; c < 3; c++) for (const a of pos[c]) for (const b of pos[c + 1]) el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], class: "tenue" });
    for (const capa of pos) for (const [x, y] of capa) el("circle", { cx: x, cy: y, r: 11, class: "nodo-red" });
    for (const onda of [0.3, 4.3]) {
      for (let c = 0; c < 3; c++) {
        const g = el("g", { "data-en": (onda + c * 0.55).toFixed(2), "data-sale": (onda + c * 0.55 + 0.7).toFixed(2), "data-desde": "none" });
        for (const a of pos[c]) for (const b of pos[c + 1]) if ((a[1] + b[1]) % 3 < 2) el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], class: "arista-luz" }, g);
      }
      for (let c = 0; c < 4; c++) {
        const g = el("g", { "data-en": (onda + c * 0.55).toFixed(2), "data-sale": (onda + c * 0.55 + 0.6).toFixed(2), "data-desde": "none" });
        for (const [x, y] of pos[c]) el("circle", { cx: x, cy: y, r: 14, class: "nodo-luz" }, g);
      }
    }
    const salida = el("circle", { cx: X[3], cy: pos[3][1][1], r: 22, fill: "none", stroke: "#f2b45a", "stroke-width": 3, "data-en": "2.0", "data-sale": "3.6", "data-desde": "none" });
    salida.style.filter = "drop-shadow(0 0 10px #f2b45a)";
  </script>
  <script src="base.js"></script>
</body></html>
